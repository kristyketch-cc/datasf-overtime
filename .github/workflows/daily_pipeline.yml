# Runs the loader every day. If it fails, GitHub marks the run as failed and
# sends a notification.

name: Daily ingest

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC, early morning in San Francisco
  workflow_dispatch:        # lets me run it by hand from the Actions tab

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests python-dotenv snowflake-connector-python

      - name: Write the Snowflake key from a repository secret
        run: printf '%s\n' "$KEY" > snowflake_key.p8
        env:
          KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Load
        run: python ingest/load_employee_compensation.py
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
